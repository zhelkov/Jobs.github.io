<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Моя библиотека — стартовая страница</title>
		<style>
			:root {
				--bg: #f4f1ea;
				--card: #ffffff;
				--ink: #1f2328;
				--muted: #6b7280;
				--accent: #2f7d32;
				--line: #e3ded2;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 2.5rem 1.2rem 4rem;
				background: var(--bg);
				color: var(--ink);
				font-family: Georgia, 'Times New Roman', serif;
				-webkit-font-smoothing: antialiased;
			}
			.wrap {
				max-width: 46rem;
				margin: 0 auto;
			}
			header {
				text-align: center;
				margin-bottom: 2.5rem;
			}
			h1 {
				font-size: 2.1rem;
				margin: 0 0 0.5rem;
				letter-spacing: 0.01em;
			}
			header p {
				margin: 0;
				color: var(--muted);
				font-size: 1rem;
			}
			h2.section {
				font-size: 1rem;
				font-weight: normal;
				text-transform: uppercase;
				letter-spacing: 0.12em;
				color: var(--muted);
				margin: 0 0 1rem;
			}
			ul.books {
				list-style: none;
				margin: 0;
				padding: 0;
				display: grid;
				gap: 1rem;
			}
			li {
				margin: 0;
			}
			a.book {
				display: block;
				position: relative;
				padding: 1.25rem 3rem 1.25rem 1.4rem;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 14px;
				text-decoration: none;
				color: inherit;
				transition:
					transform 0.12s ease,
					box-shadow 0.12s ease,
					border-color 0.12s ease;
			}
			a.book:hover,
			a.book:focus {
				transform: translateY(-2px);
				box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
				border-color: #c9c2b2;
				outline: none;
			}
			a.book::after {
				content: '→';
				position: absolute;
				right: 1.3rem;
				top: 50%;
				transform: translateY(-50%);
				font-size: 1.4rem;
				color: var(--accent);
			}
			.num {
				display: inline-block;
				min-width: 1.6rem;
				color: var(--accent);
				font-weight: bold;
			}
			.title {
				display: block;
				font-size: 1.25rem;
				margin-bottom: 0.35rem;
			}
			.author {
				display: block;
				font-size: 1rem;
				color: var(--muted);
			}
			.meta {
				display: block;
				font-size: 0.85rem;
				color: var(--muted);
				margin-top: 0.45rem;
				font-family: Arial, Helvetica, sans-serif;
			}
			footer {
				margin-top: 2.5rem;
				text-align: center;
				color: var(--muted);
				font-size: 0.85rem;
				font-family: Arial, Helvetica, sans-serif;
			}
			@media (max-width: 480px) {
				h1 {
					font-size: 1.7rem;
				}
				a.book {
					padding: 1.1rem 2.6rem 1.1rem 1.1rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="wrap">
			<header>
				<h1>Моя библиотека</h1>
				<p>Формат Ильи Франка: английский текст, пояснения и перевод</p>
			</header>

			<h2 class="section">Книги</h2>
			<ul class="books">
				<li>
					<a class="book" href="Steve_Jobs_web.html">
						<span class="title"><span class="num">1.</span> Steve Jobs</span>
						<span class="author">Walter Isaacson</span>
						<span class="meta">Steve_Jobs_web.html</span>
					</a>
				</li>
				<li>
					<a class="book" href="Beach_Read.html">
						<span class="title"><span class="num">2.</span> Beach Read</span>
						<span class="author">Emily Henry</span>
						<span class="meta">Beach_Read.html</span>
					</a>
				</li>
			</ul>

			<footer>
				Все книги лежат в этой же папке рядом со стартовой страницей
			</footer>
		</div>
	</body>
</html>
